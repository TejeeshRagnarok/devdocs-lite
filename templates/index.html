<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevDocs Lite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>DevDocs Lite</h1>
            <p>Understand your codebase instantly</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Upload Codebase</h2>
                <input type="file" id="fileInput">
                <button class="primary-btn" onclick="uploadFile()">Upload</button>
                <p id="uploadStatus" class="status"></p>
            </div>

            <div class="card">
                <h2>Ask Question</h2>
                <input type="text" id="questionInput" placeholder="How does authentication work?">
                <button class="primary-btn" onclick="askQuestion()">Ask</button>
            </div>

            <div class="card full-width">
                <h2>Answer</h2>
                <div id="answerBox" class="answer-box">Your answer will appear here...</div>
            </div>
        </div>
    </div>

    <script>
       async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const status = document.getElementById("uploadStatus");

    if (!fileInput.files.length) {
        status.innerText = "Please select a ZIP file.";
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    status.innerText = "Uploading...";

    try {
        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        // 🔥 Handle non-JSON safely
        const text = await response.text();

        try {
            const data = JSON.parse(text);

            if (!response.ok) {
                status.innerText = data.detail || "Upload failed";
                return;
            }

            status.innerText = data.message;

        } catch {
            // If response is not JSON
            status.innerText = "Server error: " + text;
        }

    } catch (error) {
        status.innerText = "Network error: " + error.message;
    }
}
        async function askQuestion() {
            const question = document.getElementById("questionInput").value;
            const answerBox = document.getElementById("answerBox");

            if (!question) {
                answerBox.innerText = "Please enter a question!";
                return;
            }

            answerBox.innerText = "Thinking...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();
                answerBox.innerText = data.answer;
            } catch (error) {
                answerBox.innerText = "Network error: " + error.message;
            }
        }
    </script>
</body>
</html>
