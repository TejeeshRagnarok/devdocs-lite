<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDocs Lite</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>DevDocs Lite</h1>
                <p id="projectSubtitle">Upload a ZIP codebase to begin.</p>
            </div>
            <form id="uploadForm" class="upload-form">
                <input type="file" id="fileInput" accept=".zip">
                <button type="submit">Upload ZIP</button>
            </form>
        </header>

        <p id="uploadStatus" class="status" role="status"></p>

        <section class="layout">
            <aside class="sidebar">
                <section class="panel">
                    <div class="panel-heading">
                        <h2>Project</h2>
                        <span id="fileCount">0 files</span>
                    </div>
                    <div id="languageList" class="language-list"></div>
                </section>

                <section class="panel">
                    <div class="panel-heading">
                        <h2>Repository Insights</h2>
                    </div>
                    <div id="insightsGrid" class="insights-grid"></div>
                </section>

                <section class="panel file-panel">
                    <div class="panel-heading">
                        <h2>Files</h2>
                        <span id="selectedFileLabel">No file selected</span>
                    </div>
                    <div class="file-filters">
                        <input type="search" id="fileFilter" placeholder="Filter files">
                        <select id="languageFilter" aria-label="Filter files by language">
                            <option value="">All languages</option>
                        </select>
                    </div>
                    <div id="fileList" class="file-list"></div>
                </section>
            </aside>

            <section class="workspace">
                <section class="panel ask-panel">
                    <form id="askForm" class="ask-form">
                        <input type="text" id="questionInput" placeholder="Ask about routes, components, config, or errors">
                        <button type="submit">Ask</button>
                    </form>
                    <pre id="answerBox" class="answer-box">Answers will appear here.</pre>
                </section>

                <section class="panel explain-panel">
                    <div class="panel-heading">
                        <h2>Repository Explanation</h2>
                        <button id="explainProjectBtn" class="explain-btn" type="button">Explain Project</button>
                    </div>
                    <pre id="explainBox" class="explain-box">Click "Explain Project" or select a file to see its explanation.</pre>
                </section>

                <section class="panel tools-panel">
                    <form id="searchForm" class="search-form">
                        <input type="search" id="searchInput" placeholder="Search indexed code">
                        <button type="submit">Search</button>
                    </form>
                    <div id="searchResults" class="search-results"></div>
                </section>

                <section class="panel preview-panel">
                    <div class="panel-heading">
                        <h2 id="previewTitle">Preview</h2>
                        <span id="previewMeta"></span>
                    </div>
                    <pre id="previewBox" class="code-preview">Select a file to preview it.</pre>
                </section>
            </section>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
